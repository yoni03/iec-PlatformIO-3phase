; Standalone reader for the P1 port of Israeli IEC Kaifa smart meters.
; Build:   pio run
; Flash:   pio run -t upload        (first time, over USB)
; Monitor: pio device monitor
; Later updates can be uploaded from the web UI (Settings > Firmware update).

[platformio]
default_envs = esp32dev

[env:esp32dev]
; espressif32 6.x = Arduino-ESP32 core 2.0.17 (stable, tested)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; 1.25MB app x2 (for OTA) + 1.375MB LittleFS for the history
board_build.partitions = default.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
; Regenerates src/web_ui.h from web/index.html before every build
extra_scripts = pre:tools/embed_web.py
